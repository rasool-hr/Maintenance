<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Work Order</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--bg:#eceff1;--card:#fff;--ink:#17202a;--mute:#5d6b78;--line:#cfd6dc;--amber:#f5b301;--amber-ink:#17202a;--ok:#1f8a4c;--red:#d63a3a;--grn:#1f8a4c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171c;--card:#1c242c;--ink:#eef2f5;--mute:#9aa8b4;--line:#33404b;--ok:#4cc17f;--red:#ff6b6b;--grn:#4cc17f}}
:root[data-theme="dark"]{--bg:#12171c;--card:#1c242c;--ink:#eef2f5;--mute:#9aa8b4;--line:#33404b;--ok:#4cc17f;--red:#ff6b6b;--grn:#4cc17f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 Barlow,system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font:700 30px/1 "Barlow Condensed","Arial Narrow",sans-serif;margin:8px 0 14px;letter-spacing:.01em}
.meta{display:grid;gap:10px;margin-bottom:16px}
label{font-size:14px;color:var(--mute);display:block;margin-bottom:4px}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:6px;padding:12px}
input[type=text]:focus,textarea:focus,button:focus-visible{outline:3px solid var(--amber);outline-offset:1px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;padding:10px;display:flex;flex-direction:column;gap:8px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tile:active{transform:scale(.97)}
#t-pre{--c:var(--red)}#t-post{--c:var(--grn)}#t-sig,#t-notes{--c:var(--ink)}
.face{position:relative;height:110px;border-radius:6px;display:grid;place-items:center;overflow:hidden;color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent)}
.face svg{width:68px;height:68px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.face img.sig{object-fit:contain;background:#fff;padding:6px}
.lbl{font:700 20px/1 "Barlow Condensed","Arial Narrow",sans-serif;text-align:center;color:var(--c)}
.tile.done{border-color:var(--grn)}
.tile.done::after{content:"\2713";position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;background:var(--grn);color:#fff;display:grid;place-items:center;font:700 16px Barlow,sans-serif}
.go{margin-top:18px;width:100%;border:0;border-radius:6px;background:var(--amber);color:var(--amber-ink);font:700 22px "Barlow Condensed","Arial Narrow",sans-serif;padding:16px;cursor:pointer}
.go[disabled]{background:var(--line);color:var(--mute);cursor:not-allowed}
.hint{color:var(--mute);font-size:14px;margin:8px 0 0;text-align:center}
.sheet{position:fixed;inset:0;background:rgba(10,14,18,.6);display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet.open{display:flex}
.panel{background:var(--card);width:100%;max-width:520px;border-radius:12px 12px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.panel h2{font:700 24px "Barlow Condensed",sans-serif;margin:0 0 10px}
#pad{width:100%;height:220px;background:#fff;border:2px solid var(--line);border-radius:6px;touch-action:none;display:block}
textarea{min-height:140px;resize:vertical}
#request{min-height:84px}
.row{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;border-radius:6px;border:2px solid var(--line);background:transparent;color:var(--ink);font:600 16px Barlow,sans-serif;padding:12px;cursor:pointer}
.btn.p{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.report img{width:100%;border-radius:6px;display:block}
.report .cap{font-size:14px;color:var(--mute);margin:12px 0 4px}
.report .sigimg{background:#fff;padding:6px}
.notes-out{white-space:pre-wrap;background:var(--card);border:2px solid var(--line);border-radius:6px;padding:12px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main id="form">
  <h1>Work order</h1>
  <div class="meta">
    <div><label for="unit">Property / unit</label><input id="unit" type="text" placeholder="e.g. 412 Oak St, Apt 3B" autocomplete="off"></div>
    <div><label for="tenant">Tenant name</label><input id="tenant" type="text" placeholder="e.g. J. Rivera" autocomplete="off"></div>
    <div><label for="request">Tenant's maintenance request</label><textarea id="request" placeholder="What does the tenant need fixed?"></textarea></div>
  </div>
  <div class="tiles">
    <button class="tile" id="t-pre" aria-label="Before photo"><span class="face"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H4M10 5l-7 7 7 7"/></svg></span><span class="lbl">Before</span></button>
    <button class="tile" id="t-post" aria-label="After photo"><span class="face"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M14 5l7 7-7 7"/></svg></span><span class="lbl">After</span></button>
    <button class="tile" id="t-sig" aria-label="Tenant signature"><span class="face"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3l5 5L8 21H3v-5z"/><path d="M13 6l5 5"/><path d="M13 22h8"/></svg></span><span class="lbl">Signature</span></button>
    <button class="tile" id="t-notes" aria-label="Notes"><span class="face"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></span><span class="lbl">Notes</span></button>
  </div>
  <button class="go" id="finish" disabled>Complete work order</button>
  <p class="hint" id="hint">Add both photos and the tenant signature to complete. Notes are optional.</p>
  <p class="hint"><button class="btn" id="reset" style="flex:none;padding:8px 14px">Start new order</button></p>
</main>

<main id="report" class="report" hidden>
  <h1>Completed</h1>
  <div class="cap" id="r-meta"></div>
  <div class="cap">Tenant request</div><div class="notes-out" id="r-req"></div>
  <div class="cap">Before</div><img id="r-pre" alt="Pre-work photo">
  <div class="cap">After</div><img id="r-post" alt="Post-work photo">
  <div class="cap">Tenant signature</div><img id="r-sig" class="sigimg" alt="Tenant signature">
  <div class="cap">Notes</div><div class="notes-out" id="r-notes"></div>
  <div class="cap" id="r-time"></div>
  <div class="row"><button class="btn" id="back">Back to edit</button><button class="btn p" id="new">New order</button></div>
</main>

<input id="cam" type="file" accept="image/*" capture="environment" hidden>

<div class="sheet" id="sig-sheet"><div class="panel">
  <h2>Tenant signature</h2>
  <canvas id="pad" aria-label="Signature area"></canvas>
  <div class="row"><button class="btn" id="sig-clear">Clear</button><button class="btn" id="sig-cancel">Cancel</button><button class="btn p" id="sig-save">Save signature</button></div>
</div></div>

<div class="sheet" id="notes-sheet"><div class="panel">
  <h2>Notes</h2>
  <textarea id="notes-text" placeholder="What was done, parts used, follow-up needed"></textarea>
  <div class="row"><button class="btn" id="notes-cancel">Cancel</button><button class="btn p" id="notes-save">Save notes</button></div>
</div></div>

<script>
var KEY="workorder-v1", S={unit:"",tenant:"",request:"",pre:"",post:"",sig:"",notes:"",done:""};
function load(){try{var v=sessionStorage.getItem(KEY);if(v)S=Object.assign(S,JSON.parse(v))}catch(e){}}
function save(){try{sessionStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert("Storage is full. Start a new order.")}}
var $=function(id){return document.getElementById(id)};

function tile(id,val,kind){
  var t=$(id),f=t.querySelector(".face"),old=f.querySelector("img");
  if(old)old.remove();
  t.classList.toggle("done",!!val);
  if(val&&kind){var im=document.createElement("img");im.src=val;im.alt="";if(kind==="sig")im.className="sig";f.appendChild(im)}
}
function render(){
  $("unit").value=S.unit;$("tenant").value=S.tenant;$("request").value=S.request;
  tile("t-pre",S.pre,"img");tile("t-post",S.post,"img");tile("t-sig",S.sig,"sig");tile("t-notes",S.notes,"");
  var left=[["pre","before photo"],["post","after photo"],["sig","signature"]] .filter(function(p){return !S[p[0]]}).map(function(p){return p[1]});
  $("finish").disabled=left.length>0;
  $("hint").textContent=left.length?"Still needed: "+left.join(", ")+".":"Ready to complete.";
  $("hint").hidden=false;
  if(S.done)showReport();
}
function showReport(){
  $("form").hidden=true;$("report").hidden=false;
  $("r-meta").textContent=(S.unit||"No unit")+" - "+(S.tenant||"No tenant");
  $("r-pre").src=S.pre;$("r-post").src=S.post;$("r-sig").src=S.sig;
  $("r-notes").textContent=S.notes||"None entered";$("r-req").textContent=S.request||"None entered";
  $("r-time").textContent="Completed "+new Date(S.done).toLocaleString();
}
$("unit").addEventListener("input",function(e){S.unit=e.target.value;save()});
$("tenant").addEventListener("input",function(e){S.tenant=e.target.value;save()});
$("request").addEventListener("input",function(e){S.request=e.target.value;save()});

/* Photos */
var slot=null;
["pre","post"].forEach(function(k){$("t-"+k).addEventListener("click",function(){slot=k;$("cam").value="";$("cam").click()})});
$("cam").addEventListener("change",function(e){
  var f=e.target.files[0];if(!f||!slot)return;
  var k=slot,r=new FileReader();
  r.onload=function(){var im=new Image();im.onload=function(){
    var m=900,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    S[k]=c.toDataURL("image/jpeg",.6);save();render();
  };im.src=r.result};r.readAsDataURL(f);
});

/* Signature */
var pad=$("pad"),ctx,drawing=false,inked=false;
function sizePad(){var d=window.devicePixelRatio||1,w=pad.clientWidth,h=pad.clientHeight;pad.width=w*d;pad.height=h*d;ctx=pad.getContext("2d");ctx.scale(d,d);ctx.lineWidth=2.5;ctx.lineCap="round";ctx.strokeStyle="#111";inked=false}
function pt(e){var r=pad.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
pad.addEventListener("pointerdown",function(e){drawing=true;pad.setPointerCapture(e.pointerId);var p=pt(e);ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(p[0]+.1,p[1]);ctx.stroke();inked=true});
pad.addEventListener("pointermove",function(e){if(!drawing)return;var p=pt(e);ctx.lineTo(p[0],p[1]);ctx.stroke()});
["pointerup","pointercancel"].forEach(function(n){pad.addEventListener(n,function(){drawing=false})});
$("t-sig").addEventListener("click",function(){$("sig-sheet").classList.add("open");sizePad()});
$("sig-clear").addEventListener("click",sizePad);
$("sig-cancel").addEventListener("click",function(){$("sig-sheet").classList.remove("open")});
$("sig-save").addEventListener("click",function(){
  if(!inked){alert("Ask the tenant to sign first.");return}
  var c=document.createElement("canvas");c.width=pad.width;c.height=pad.height;
  var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(pad,0,0);
  S.sig=c.toDataURL("image/png");save();$("sig-sheet").classList.remove("open");render();
});

/* Notes */
$("t-notes").addEventListener("click",function(){$("notes-text").value=S.notes;$("notes-sheet").classList.add("open");$("notes-text").focus()});
$("notes-cancel").addEventListener("click",function(){$("notes-sheet").classList.remove("open")});
$("notes-save").addEventListener("click",function(){S.notes=$("notes-text").value.trim();save();$("notes-sheet").classList.remove("open");render()});

/* Finish */
$("finish").addEventListener("click",function(){S.done=new Date().toISOString();save();showReport()});
$("back").addEventListener("click",function(){S.done="";save();$("report").hidden=true;$("form").hidden=false;render()});
function fresh(){if(S.done||confirm("Discard this work order and start a new one?")){S={unit:"",tenant:"",request:"",pre:"",post:"",sig:"",notes:"",done:""};save();$("report").hidden=true;$("form").hidden=false;render()}}
$("reset").addEventListener("click",fresh);$("new").addEventListener("click",fresh);

// Start with a completely fresh work order on every page load/refresh.
// sessionStorage normally survives a refresh, so explicitly clear this app's draft.
try{sessionStorage.removeItem(KEY)}catch(e){}
S={unit:"",tenant:"",request:"",pre:"",post:"",sig:"",notes:"",done:""};
render();
</script>
</body>
</html>
